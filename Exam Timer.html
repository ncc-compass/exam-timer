    <!-- SF Pro Display Fallbacks & Inter for Crisp Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           APPLE DESIGN SYSTEM: HUMAN INTERFACE GUIDELINES
           ========================================== */
        :root {
            --sf-font: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            
            /* Color Palette: macOS Dark/Light Harmonized Minimalism */
            --bg-system: #f5f5f7;
            --surface-glass: rgba(255, 255, 255, 0.72);
            --surface-solid: #ffffff;
            
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            
            --accent: #0071e3;
            --accent-hover: #0077ed;
            
            --border-glass: rgba(0, 0, 0, 0.06);
            --shadow-apple: 0 24px 48px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
            --shadow-modal: 0 24px 48px rgba(0, 0, 0, 0.12);
            
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--sf-font);
            background-color: var(--bg-system);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ==========================================
           MACOS-STYLE HEADER / STATUS BAR (Logos Only)
           ========================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 48px;
            background-color: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            height: 64px;
            flex-shrink: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Enforce identical fixed size for both logos regardless of original dimensions */
        .uniform-logo {
            width: 100px;
            height: 32px;
            object-fit: contain;
            display: block;
        }

        .apple-btn-secondary {
            background-color: rgba(0, 0, 0, 0.04);
            border: none;
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 980px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .apple-btn-secondary:hover {
            background-color: rgba(0, 0, 0, 0.08);
        }

        /* ==========================================
           MAIN CONTAINER & SETUP MODAL
           ========================================== */
        main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        #setup-modal {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: var(--transition-smooth);
        }

        .modal-card {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 44px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-modal);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .modal-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            background-color: rgba(255, 255, 255, 0.6);
            transition: var(--transition-smooth);
        }

        .form-group input:focus {
            border-color: var(--accent);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }

        .modal-actions {
            margin-top: 32px;
            display: flex;
            justify-content: flex-end;
        }

        .apple-btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 980px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        .apple-btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        /* ==========================================
           LAYOUT VARIANT A: CENTERED (Default)
           ========================================== */
        .layout-centered {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* ==========================================
           LAYOUT VARIANT B: SPLIT VIEW (Apple Typography & Spacing)
           ========================================== */
        .layout-split {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 60px 80px;
            gap: 80px;
            align-items: center;
            justify-content: center;
        }

        /* Left Side: Editorial Typography Styling */
        .exam-info-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            max-width: 650px;
        }

        .exam-title-display {
            font-size: clamp(2.5rem, 4vw, 3.75rem);
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.08;
            letter-spacing: -0.035em;
        }

        .exam-meta-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .exam-date-text {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        .exam-time-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .exam-duration-pill {
            display: inline-flex;
            align-items: center;
            background-color: rgba(0, 113, 227, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 980px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
            margin-top: 8px;
            letter-spacing: -0.01em;
        }

        /* Right Side: Seamless Hardware-Inspired Clock Container (~10% larger) */
        .clock-wrapper-section {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .apple-clock-card {
            background-color: var(--surface-solid);
            padding: 40px;
            border-radius: 36px;
            box-shadow: var(--shadow-apple);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 440px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            position: relative;
        }

        /* Segmented Control Tabs (macOS Native Look) */
        .apple-segmented-control {
            display: flex;
            background: rgba(0, 0, 0, 0.05);
            padding: 3px;
            border-radius: 980px;
            margin-bottom: 28px;
            width: 100%;
        }

        .segment-tab {
            flex: 1;
            background: transparent;
            border: none;
            padding: 7px 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 980px;
            transition: var(--transition-smooth);
            text-align: center;
        }

        .segment-tab.active {
            background-color: var(--surface-solid);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-weight: 600;
        }

        /* Circular Ring Track (~10% larger: 264px dimensions) */
        .circular-progress-container {
            position: relative;
            width: 264px;
            height: 264px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-ring__circle-bg {
            fill: none;
            stroke: #e5e5ea;
            stroke-width: 6;
        }

        .progress-ring__circle-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s linear, stroke 0.6s ease;
        }

        .clock-inner-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .apple-time-display {
            font-variant-numeric: tabular-nums;
            font-size: 3.1rem;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .timer-setup-mini {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .timer-setup-mini input {
            width: 58px;
            font-variant-numeric: tabular-nums;
            font-size: 1.65rem;
            font-weight: 300;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            padding: 4px;
            color: var(--text-primary);
            outline: none;
            background: #fafafa;
            transition: var(--transition-smooth);
        }

        .timer-setup-mini input:focus {
            border-color: var(--accent);
            background: #fff;
        }

        .timer-setup-separator {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-tertiary);
        }

        /* Minimal Control Buttons */
        .clock-controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .control-action-btn {
            flex: 1;
            padding: 11px 0;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 980px;
            cursor: pointer;
            border: none;
            transition: var(--transition-smooth);
        }

        .btn-start-action {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }
        .btn-start-action:hover { background-color: var(--accent-hover); }

        .btn-secondary-action {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }
        .btn-secondary-action:hover { background-color: rgba(0, 0, 0, 0.08); }

        .clock-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .clock-panel.active {
            display: flex;
        }

        /* ==========================================
           CURRENT REAL-TIME DIGITAL CLOCK (Bottom)
           ========================================== */
        .current-clock-footer {
            text-align: center;
            margin-top: 4px;
        }

        .current-clock-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .current-clock-digital {
            font-variant-numeric: tabular-nums;
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* Utility classes */
        .hidden {
            display: none !important;
        }
    </style>
</head>

    <!-- ==========================================
         MAIN WRAPPER
         ========================================== -->
    <main>
        <!-- SETUP MODAL (Initial State) -->
        <div id="setup-modal">
            <div class="modal-card">
                <h2>Exam Configuration</h2>
                <form id="exam-form">
                    <div class="form-group">
                        <label for="exam-name-input">Exam Name</label>
                        <input type="text" id="exam-name-input" required placeholder="e.g., Computer Science Final">
                    </div>
                    <div class="form-group">
                        <label for="exam-date-input">Exam Date</label>
                        <input type="date" id="exam-date-input" required>
                    </div>
                    <div class="form-group">
                        <label for="start-time-input">Start Time</label>
                        <input type="time" id="start-time-input" value="00:00" required>
                    </div>
                    <div class="form-group">
                        <label for="end-time-input">End Time</label>
                        <input type="time" id="end-time-input" value="00:00" required>
                    </div>
                    <div class="form-group">
                        <label for="duration-input">Duration (Minutes)</label>
                        <input type="number" id="duration-input" min="1" required placeholder="e.g., 60">
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="apple-btn-primary">Continue</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MAIN LAYOUT CONTAINER -->
        <div id="layout-container" class="layout-centered">
            
            <!-- EXAM INFO SECTION (Left Side in Split Mode) -->
            <div class="exam-info-section hidden" id="exam-info-section">
                <h1 class="exam-title-display" id="out-exam-name">The Exam Name Here</h1>
                <div class="exam-meta-group">
                    <div class="exam-date-text" id="out-date">dd - month - Year</div>
                    <div class="exam-time-text" id="out-times">12:00 AM - 12:00 AM</div>
                </div>
                <div>
                    <span class="exam-duration-pill" id="out-duration">Duration: 60 Mins</span>
                </div>
            </div>

            <!-- CLOCK SECTION -->
            <div class="clock-wrapper-section" id="clock-wrapper-section">
                
                <div class="apple-clock-card">
                    <!-- Segmented Control Tabs -->
                    <div class="apple-segmented-control">
                        <button class="segment-tab active" data-target="timer-panel">Timer</button>
                        <button class="segment-tab" data-target="stopwatch-panel">Stopwatch</button>
                    </div>

                    <!-- Circular Progress & Display Area (~10% larger dimensions: radius = 58, circumference ≈ 364.42) -->
                    <div class="circular-progress-container">
                        <svg class="progress-ring" viewBox="0 0 130 130">
                            <circle class="progress-ring__circle-bg" cx="65" cy="65" r="58"></circle>
                            <circle class="progress-ring__circle-fill" id="progress-ring-fill" cx="65" cy="65" r="58" stroke-dasharray="364.42" stroke-dashoffset="0"></circle>
                        </svg>

                        <!-- TIMER PANEL CONTENT -->
                        <div class="clock-panel active" id="timer-panel">
                            <div class="timer-setup-mini" id="timer-setup-inputs">
                                <input type="number" id="in-hours" min="0" max="99" value="01">
                                <span class="timer-setup-separator">:</span>
                                <input type="number" id="in-minutes" min="0" max="59" value="00">
                                <span class="timer-setup-separator">:</span>
                                <input type="number" id="in-seconds" min="0" max="59" value="00">
                            </div>
                            <div class="apple-time-display hidden" id="timer-digital-display">01:00:00</div>
                        </div>

                        <!-- STOPWATCH PANEL CONTENT -->
                        <div class="clock-panel" id="stopwatch-panel">
                            <div class="apple-time-display" id="stopwatch-digital-display">00:00.00</div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="clock-panel active" id="timer-controls-panel" style="width: 100%;">
                        <div class="clock-controls">
                            <button class="control-action-btn btn-start-action" id="timer-start-btn">Start</button>
                            <button class="control-action-btn btn-secondary-action hidden" id="timer-pause-btn">Pause</button>
                            <button class="control-action-btn btn-secondary-action hidden" id="timer-reset-btn">Reset</button>
                        </div>
                    </div>

                    <div class="clock-panel" id="stopwatch-controls-panel" style="width: 100%;">
                        <div class="clock-controls">
                            <button class="control-action-btn btn-start-action" id="sw-start-btn">Start</button>
                            <button class="control-action-btn btn-secondary-action hidden" id="sw-pause-btn">Stop</button>
                            <button class="control-action-btn btn-secondary-action" id="sw-reset-btn">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Current Digital Real-time Clock -->
                <div class="current-clock-footer">
                    <div class="current-clock-label">Current Time</div>
                    <div class="current-clock-digital" id="real-time-clock">12:00:00 AM</div>
                </div>

            </div>
        </div>
    </main>

    <!-- ==========================================
         JAVASCRIPT LOGIC
         ========================================== -->
    <script>
        /* ==========================================
           1. REAL-TIME DIGITAL CLOCK
           ========================================== */
        function updateRealTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            
            document.getElementById('real-time-clock').textContent = 
                `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateRealTime, 1000);
        updateRealTime();

        /* ==========================================
           2. TABS SWITCHING
           ========================================== */
        const segmentTabs = document.querySelectorAll('.segment-tab');
        const timerPanel = document.getElementById('timer-panel');
        const stopwatchPanel = document.getElementById('stopwatch-panel');
        const timerControlsPanel = document.getElementById('timer-controls-panel');
        const stopwatchControlsPanel = document.getElementById('stopwatch-controls-panel');

        segmentTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                segmentTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const target = tab.getAttribute('data-target');
                if (target === 'timer-panel') {
                    timerPanel.classList.add('active');
                    stopwatchPanel.classList.remove('active');
                    timerControlsPanel.classList.add('active');
                    stopwatchControlsPanel.classList.remove('active');
                } else {
                    stopwatchPanel.classList.add('active');
                    timerPanel.classList.remove('active');
                    stopwatchControlsPanel.classList.add('active');
                    timerControlsPanel.classList.remove('active');
                }
            });
        });

        /* ==========================================
           3. SETUP FORM & LAYOUT SHIFTING
           ========================================== */
        const setupModal = document.getElementById('setup-modal');
        const examForm = document.getElementById('exam-form');
        const layoutContainer = document.getElementById('layout-container');
        const examInfoSection = document.getElementById('exam-info-section');
        const configBtnWrapper = document.getElementById('config-btn-wrapper');
        const btnChangeConfig = document.getElementById('btn-change-config');

        examForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('exam-name-input').value;
            const rawDate = document.getElementById('exam-date-input').value;
            const startT = document.getElementById('start-time-input').value;
            const endT = document.getElementById('end-time-input').value;
            const durationMins = document.getElementById('duration-input').value;

            let formattedDate = rawDate;
            if (rawDate) {
                const dObj = new Date(rawDate);
                const options = { day: '2-digit', month: 'long', year: 'numeric' };
                formattedDate = dObj.toLocaleDateString('en-US', options).replace(',', ' -').replace(',', '');
            }

            function format12Hr(timeStr) {
                if (!timeStr) return '';
                let [h, m] = timeStr.split(':');
                let hours = parseInt(h, 10);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                return `${hours}:${m} ${ampm}`;
            }

            document.getElementById('out-exam-name').textContent = name;
            document.getElementById('out-date').textContent = formattedDate;
            document.getElementById('out-times').textContent = `${format12Hr(startT)} - ${format12Hr(endT)}`;
            document.getElementById('out-duration').textContent = `Duration: ${durationMins} Minutes`;

            const totalSecs = parseInt(durationMins) * 60;
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;

            document.getElementById('in-hours').value = String(hrs).padStart(2, '0');
            document.getElementById('in-minutes').value = String(mins).padStart(2, '0');
            document.getElementById('in-seconds').value = String(secs).padStart(2, '0');

            setupModal.classList.add('hidden');
            layoutContainer.classList.remove('layout-centered');
            layoutContainer.classList.add('layout-split');
            examInfoSection.classList.remove('hidden');
            configBtnWrapper.style.display = 'block';
        });

        btnChangeConfig.addEventListener('click', () => {
            setupModal.classList.remove('hidden');
        });

        /* ==========================================
           4. ALARM SOUND GENERATOR (3-Second Sound)
           ========================================== */
        function playGoogleAlarm() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                let count = 0;
                const maxBeeps = 6;

                function triggerBeep() {
                    if (count >= maxBeeps) {
                        ctx.close();
                        return;
                    }
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(830, ctx.currentTime);

                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);

                    count++;
                    setTimeout(triggerBeep, 500);
                }
                triggerBeep();
            } catch (err) {
                console.log("AudioContext restricted.", err);
            }
        }

        /* ==========================================
           5. TIMER LOGIC & RING PROGRESS (Blue to Gray Drain)
           ========================================== */
        const ringFill = document.getElementById('progress-ring-fill');
        const circumference = 2 * Math.PI * 58; // r = 58 -> ~364.42
        ringFill.style.strokeDasharray = circumference;

        function setCircleProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            ringFill.style.strokeDashoffset = offset;

            // Shift to Apple red warning under 15%, otherwise vibrant blue
            if (percent <= 15) {
                ringFill.style.stroke = '#ff3b30';
            } else {
                ringFill.style.stroke = '#0071e3';
            }
        }

        let timerInterval = null;
        let totalTimerSecs = 0;
        let remainingSecs = 0;
        let isTimerActive = false;

        const timerSetupInputs = document.getElementById('timer-setup-inputs');
        const timerDigitalDisplay = document.getElementById('timer-digital-display');
        const timerStartBtn = document.getElementById('timer-start-btn');
        const timerPauseBtn = document.getElementById('timer-pause-btn');
        const timerResetBtn = document.getElementById('timer-reset-btn');

        const inHours = document.getElementById('in-hours');
        const inMinutes = document.getElementById('in-minutes');
        const inSeconds = document.getElementById('in-seconds');

        function formatTimerString(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = secs % 60;
            if (h > 0) {
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        timerStartBtn.addEventListener('click', () => {
            if (!isTimerActive) {
                if (remainingSecs === 0) {
                    const h = parseInt(inHours.value) || 0;
                    const m = parseInt(inMinutes.value) || 0;
                    const s = parseInt(inSeconds.value) || 0;
                    totalTimerSecs = (h * 3600) + (m * 60) + s;
                    remainingSecs = totalTimerSecs;
                }

                if (remainingSecs <= 0) return;

                timerSetupInputs.classList.add('hidden');
                timerDigitalDisplay.classList.remove('hidden');

                timerStartBtn.textContent = 'Resume';
                timerStartBtn.classList.add('hidden');
                timerPauseBtn.classList.remove('hidden');
                timerResetBtn.classList.remove('hidden');

                isTimerActive = true;

                timerInterval = setInterval(() => {
                    if (remainingSecs > 0) {
                        remainingSecs--;
                        timerDigitalDisplay.textContent = formatTimerString(remainingSecs);
                        
                        const progressPercent = (remainingSecs / totalTimerSecs) * 100;
                        setCircleProgress(progressPercent);
                    }

                    if (remainingSecs === 0) {
                        clearInterval(timerInterval);
                        isTimerActive = false;
                        playGoogleAlarm();

                        timerPauseBtn.classList.add('hidden');
                        timerStartBtn.textContent = 'Start';
                        timerStartBtn.classList.remove('hidden');
                    }
                }, 1000);
            }
        });

        timerPauseBtn.addEventListener('click', () => {
            if (isTimerActive) {
                clearInterval(timerInterval);
                isTimerActive = false;
                timerPauseBtn.classList.add('hidden');
                timerStartBtn.classList.remove('hidden');
            }
        });

        timerResetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isTimerActive = false;
            remainingSecs = 0;
            setCircleProgress(100);

            timerDigitalDisplay.classList.add('hidden');
            timerSetupInputs.classList.remove('hidden');

            timerPauseBtn.classList.add('hidden');
            timerResetBtn.classList.add('hidden');
            timerStartBtn.textContent = 'Start';
            timerStartBtn.classList.remove('hidden');
        });

        setCircleProgress(100);

        /* ==========================================
           6. STOPWATCH LOGIC
           ========================================== */
        let swInterval = null;
        let swElapsedMs = 0;
        let isSwActive = false;

        const stopwatchDigitalDisplay = document.getElementById('stopwatch-digital-display');
        const swStartBtn = document.getElementById('sw-start-btn');
        const swPauseBtn = document.getElementById('sw-pause-btn');
        const swResetBtn = document.getElementById('sw-reset-btn');

        function formatStopwatch(ms) {
            const centis = Math.floor((ms % 1000) / 10);
            const totalSecs = Math.floor(ms / 1000);
            const secs = totalSecs % 60;
            const mins = Math.floor(totalSecs / 60) % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(centis).padStart(2, '0')}`;
        }

        swStartBtn.addEventListener('click', () => {
            if (!isSwActive) {
                isSwActive = true;
                swStartBtn.classList.add('hidden');
                swPauseBtn.classList.remove('hidden');

                let lastTime = performance.now();
                swInterval = setInterval(() => {
                    const now = performance.now();
                    swElapsedMs += (now - lastTime);
                    lastTime = now;
                    stopwatchDigitalDisplay.textContent = formatStopwatch(swElapsedMs);
                }, 10);
            }
        });

        swPauseBtn.addEventListener('click', () => {
            if (isSwActive) {
                clearInterval(swInterval);
                isSwActive = false;
                swPauseBtn.classList.add('hidden');
                swStartBtn.textContent = 'Resume';
                swStartBtn.classList.remove('hidden');
            }
        });

        swResetBtn.addEventListener('click', () => {
            clearInterval(swInterval);
            isSwActive = false;
            swElapsedMs = 0;
            stopwatchDigitalDisplay.textContent = "00:00.00";
            swPauseBtn.classList.add('hidden');
            swStartBtn.textContent = 'Start';
            swStartBtn.classList.remove('hidden');
        });
    </script>
</body>
</html>
