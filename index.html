    <style>
        /* ==========================================================================
           CUSTOMIZABLE CONFIGURATION VARIABLES & STYLING CONTROLS
           ========================================================================== */
        :root {
            /* 3. EXAM NAME & TIMER BLOCK */
            --exam-title-font-size: clamp(2rem, 4vw, 3.5vmax); /* Doubled font size */
            --exam-title-max-width: 750px; /* Fixed width container for exam name */
            --block-gap: 25px; /* Fixed gap between exam title and timer */

            /* 4. PROGRESS BAR CONFIGURATION */
            --progress-bar-thickness: 6px; /* Thickness of the progress bar */
            --progress-bar-color: #ffffff; /* Progress bar color */
            --progress-padding-x: 60px; /* Horizontal breathing room around the timer */
            --progress-padding-y: 40px; /* Vertical breathing room around the timer */

            /* 5. TIME ADJUSTMENT ARROWS & INPUTS */
            --arrow-color: rgba(255, 255, 255, 0.4); /* Subtle gray up/down buttons */
            --arrow-hover-color: rgba(255, 255, 255, 0.9);
            --arrow-size: 18px;

            /* 6. BACKGROUND CONFIGURATION (Static background gradient) */
            --bg-image: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: var(--bg-image);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            padding: 30px 40px;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        /* 1. Custom Logo Container */
        .logo-container img, .logo-container div {
            height: 60px;
            object-fit: contain;
        }
        .default-logo {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        /* 4. Current Exam Date */
        .exam-date {
            font-size: 1.6rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Main Center Dashboard Container */
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        /* 3. Unified Center Block */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Exam Title Text with Placeholder Styling */
        .exam-title {
            font-size: var(--exam-title-font-size);
            font-weight: 600;
            width: var(--exam-title-max-width);
            max-width: 90vw;
            line-height: 1.25;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: center;
            margin-bottom: var(--block-gap);
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            resize: none;
        }

        /* Placeholder state styling */
        .exam-title.placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .exam-title[contenteditable="true"]:hover {
            outline: 1px dashed rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        /* Timer Box with Rounded Rectangle Progress Bar */
        .timer-progress-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--progress-padding-y) var(--progress-padding-x);
        }

        /* SVG Progress Border Container */
        .progress-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .progress-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: var(--progress-bar-thickness);
        }

        .progress-bar-path {
            fill: none;
            stroke: var(--progress-bar-color);
            stroke-width: var(--progress-bar-thickness);
            stroke-linecap: round;
            transform-origin: center;
            transition: stroke-dashoffset 0.2s linear;
        }

        /* Timer Digits Display (6-digit support fixed-width monospaced layout) */
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 2.2ch;
            text-align: center;
        }

        .time-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: inherit;
            font-weight: inherit;
            font-family: inherit;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        .time-input::-webkit-outer-spin-button,
        .time-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-separator {
            padding: 0 0.1ch;
            opacity: 0.8;
            user-select: none;
        }

        /* 5. Subtle Gray Up/Down Arrow Buttons aligned over Hour, Minute, Second blocks */
        .arrow-btn {
            background: none;
            border: none;
            color: var(--arrow-color);
            cursor: pointer;
            font-size: var(--arrow-size);
            padding: 4px;
            line-height: 1;
            transition: color 0.2s ease, transform 0.1s ease;
            user-select: none;
        }

        .arrow-btn:hover {
            color: var(--arrow-hover-color);
        }

        .arrow-btn:active {
            transform: scale(0.9);
        }

        .arrow-up {
            margin-bottom: 2px;
        }

        .arrow-down {
            margin-top: 2px;
        }

        /* Controls Section */
        .controls-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
            width: 100%;
        }

        .control-btn {
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            border-radius: 50px;
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        /* Initial Play Button Size (matches progress bar width approximately) */
        #play-btn {
            width: 320px;
            max-width: 80vw;
            height: 52px;
        }

        /* Secondary State Buttons (Pause/Resume and Reset) */
        .dual-btn {
            width: 150px;
            height: 52px;
        }

        .hidden {
            display: none !important;
        }
    </style>

                 <img src="data:image/png;base64,YOUR_BASE64_STRING_HERE" alt="Custom Logo"> -->

        <!-- 4. Dynamic Exam Date -->
        <div class="exam-date" id="exam-date-display">08 October, 2026</div>
    </div>

    <!-- Main Dashboard -->
    <div class="dashboard-container">
        <div class="center-block">
            <!-- Exam Name / Title with Placeholder Behavior -->
            <div class="exam-title placeholder" contenteditable="true" spellcheck="false" id="exam-title-text">Insert Exam Name Here</div>

            <!-- Timer Block with Progress Bar -->
            <div class="timer-progress-wrapper" id="timer-wrapper">
                <!-- SVG Rounded Rectangle Progress Bar -->
                <svg class="progress-svg" id="progress-svg" preserveAspectRatio="none">
                    <rect class="progress-track" id="progress-track" rx="20" ry="20"></rect>
                    <rect class="progress-bar-path" id="progress-bar-path" rx="20" ry="20"></rect>
                </svg>

                <!-- Timer Digits -->
                <div class="timer-display" id="timer-display">
                    <!-- Hours Group -->
                    <div class="time-group">
                        <button class="arrow-btn arrow-up" onclick="adjustTime('hours', 1)">▲</button>
                        <input type="text" id="hours-input" class="time-input" value="00" maxlength="2" inputmode="numeric">
                        <button class="arrow-btn arrow-down" onclick="adjustTime('hours', -1)">▼</button>
                    </div>
                    <span class="time-separator">:</span>
                    <!-- Minutes Group -->
                    <div class="time-group">
                        <button class="arrow-btn arrow-up" onclick="adjustTime('minutes', 1)">▲</button>
                        <input type="text" id="minutes-input" class="time-input" value="00" maxlength="2" inputmode="numeric">
                        <button class="arrow-btn arrow-down" onclick="adjustTime('minutes', -1)">▼</button>
                    </div>
                    <span class="time-separator">:</span>
                    <!-- Seconds Group -->
                    <div class="time-group">
                        <button class="arrow-btn arrow-up" onclick="adjustTime('seconds', 1)">▲</button>
                        <input type="text" id="seconds-input" class="time-input" value="00" maxlength="2" inputmode="numeric">
                        <button class="arrow-btn arrow-down" onclick="adjustTime('seconds', -1)">▼</button>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-container">
                <button class="control-btn" id="play-btn" onclick="startTimer()">Start</button>
                <button class="control-btn dual-btn hidden" id="pause-btn" onclick="pauseTimer()">Pause</button>
                <button class="control-btn dual-btn hidden" id="reset-btn" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Empty spacer to balance layout -->
    <div></div>

    <script>
        /* ==========================================================================
           TIMER LOGIC & INTERACTION CONTROLLER
           ========================================================================== */

        // Set Current Date in format: 08 October, 2026
        const options = { day: '2-digit', month: 'long', year: 'numeric' };
        const currentDateStr = new Date().toLocaleDateString('en-GB', options);
        document.getElementById('exam-date-display').textContent = currentDateStr;

        let totalSeconds = 0; // Default 00:00:00
        let initialSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        const examTitleEl = document.getElementById('exam-title-text');
        const placeholderText = "Insert Exam Name Here";

        // Placeholder behavior logic for contenteditable
        examTitleEl.addEventListener('focus', () => {
            if (examTitleEl.textContent.trim() === placeholderText) {
                examTitleEl.textContent = "";
                examTitleEl.classList.remove('placeholder');
            }
        });

        examTitleEl.addEventListener('blur', () => {
            if (examTitleEl.textContent.trim() === "") {
                examTitleEl.textContent = placeholderText;
                examTitleEl.classList.add('placeholder');
            }
        });

        const hoursInput = document.getElementById('hours-input');
        const minutesInput = document.getElementById('minutes-input');
        const secondsInput = document.getElementById('seconds-input');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');

        // SVG Progress Bar Elements
        const timerWrapper = document.getElementById('timer-wrapper');
        const progressBarPath = document.getElementById('progress-bar-path');
        const progressTrack = document.getElementById('progress-track');

        function updateSvgDimensions() {
            const width = timerWrapper.offsetWidth;
            const height = timerWrapper.offsetHeight;
            progressTrack.setAttribute('width', width - 2);
            progressTrack.setAttribute('height', height - 2);
            progressTrack.setAttribute('x', 1);
            progressTrack.setAttribute('y', 1);

            progressBarPath.setAttribute('width', width - 2);
            progressBarPath.setAttribute('height', height - 2);
            progressBarPath.setAttribute('x', 1);
            progressBarPath.setAttribute('y', 1);

            // Calculate perimeter of rounded rectangle for stroke-dasharray
            const rx = 20;
            const w = width - 2;
            const h = height - 2;
            const perimeter = 2 * (w + h) - 8 * rx + 2 * Math.PI * rx;
            progressBarPath.style.dashArray = perimeter;
            progressBarPath.style.setProperty('--perimeter', perimeter);
            updateProgressVisual(totalSeconds, initialSeconds);
        }

        window.addEventListener('resize', updateSvgDimensions);
        window.addEventListener('load', updateSvgDimensions);

        function updateProgressVisual(current, total) {
            const perimeter = parseFloat(progressBarPath.style.getPropertyValue('--perimeter')) || 1000;
            const progressRatio = total > 0 ? current / total : 0;
            const dashOffset = perimeter * (1 - progressRatio);
            progressBarPath.style.strokeDasharray = perimeter;
            progressBarPath.style.strokeDashoffset = dashOffset;
        }

        function syncInputsFromSeconds() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            hoursInput.value = String(h).padStart(2, '0');
            minutesInput.value = String(m).padStart(2, '0');
            secondsInput.value = String(s).padStart(2, '0');
        }

        function calculateSecondsFromInputs() {
            const h = parseInt(hoursInput.value) || 0;
            const m = parseInt(minutesInput.value) || 0;
            const s = parseInt(secondsInput.value) || 0;
            return h * 3600 + m * 60 + s;
        }

        // Strict input validation (Digits only, max 2 chars, silent rejection of letters/extras)
        function setupInputValidation(inputEl) {
            inputEl.addEventListener('input', (e) => {
                let val = inputEl.value.replace(/\D/g, ''); // Remove non-digits silently
                if (val.length > 2) {
                    val = val.slice(0, 2); // Max 2 digits
                }
                inputEl.value = val;
                if(!isRunning) {
                    totalSeconds = calculateSecondsFromInputs();
                    initialSeconds = totalSeconds > 0 ? totalSeconds : 1;
                    updateProgressVisual(totalSeconds, initialSeconds);
                }
            });

            inputEl.addEventListener('blur', () => {
                if (inputEl.value === '' || isNaN(parseInt(inputEl.value))) {
                    inputEl.value = '00';
                } else {
                    inputEl.value = String(parseInt(inputEl.value)).padStart(2, '0');
                }
                if(!isRunning) {
                    totalSeconds = calculateSecondsFromInputs();
                    initialSeconds = totalSeconds > 0 ? totalSeconds : 1;
                    updateProgressVisual(totalSeconds, initialSeconds);
                }
            });
        }

        setupInputValidation(hoursInput);
        setupInputValidation(minutesInput);
        setupInputValidation(secondsInput);

        function adjustTime(unit, amount) {
            if (isRunning) return;
            let h = parseInt(hoursInput.value) || 0;
            let m = parseInt(minutesInput.value) || 0;
            let s = parseInt(secondsInput.value) || 0;

            if (unit === 'hours') h = Math.max(0, Math.min(99, h + amount));
            if (unit === 'minutes') m = Math.max(0, Math.min(59, m + amount));
            if (unit === 'seconds') s = Math.max(0, Math.min(59, s + amount));

            hoursInput.value = String(h).padStart(2, '0');
            minutesInput.value = String(m).padStart(2, '0');
            secondsInput.value = String(s).padStart(2, '0');

            totalSeconds = calculateSecondsFromInputs();
            initialSeconds = totalSeconds > 0 ? totalSeconds : 1;
            updateProgressVisual(totalSeconds, initialSeconds);
        }

        function startTimer() {
            totalSeconds = calculateSecondsFromInputs();
            if (totalSeconds <= 0) return;
            
            initialSeconds = totalSeconds;
            isRunning = true;

            // Toggle buttons
            playBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            resetBtn.classList.remove('hidden');
            pauseBtn.textContent = 'Pause';

            // Disable input fields while running
            hoursInput.disabled = true;
            minutesInput.disabled = true;
            secondsInput.disabled = true;

            document.querySelectorAll('.arrow-btn').forEach(btn => btn.style.pointerEvents = 'none');

            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    syncInputsFromSeconds();
                    updateProgressVisual(totalSeconds, initialSeconds);
                }

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    playAlarm();
                    pauseBtn.textContent = 'Pause';
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) {
                // Resume
                if (totalSeconds > 0) {
                    isRunning = true;
                    pauseBtn.textContent = 'Pause';
                    timerInterval = setInterval(() => {
                        if (totalSeconds > 0) {
                            totalSeconds--;
                            syncInputsFromSeconds();
                            updateProgressVisual(totalSeconds, initialSeconds);
                        }
                        if (totalSeconds <= 0) {
                            clearInterval(timerInterval);
                            isRunning = false;
                            playAlarm();
                        }
                    }, 1000);
                }
            } else {
                // Pause
                clearInterval(timerInterval);
                isRunning = false;
                pauseBtn.textContent = 'Resume';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalSeconds = 0; // Reset to all 00
            initialSeconds = 1;
            syncInputsFromSeconds();
            updateProgressVisual(totalSeconds, initialSeconds);

            // Re-enable inputs
            hoursInput.disabled = false;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            document.querySelectorAll('.arrow-btn').forEach(btn => btn.style.pointerEvents = 'auto');

            // Reset buttons
            playBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            pauseBtn.textContent = 'Pause';
        }

        // 7. Subtle 2-second Alarm Tone when time is up
    // 7. iPhone "Radial" Alarm Tone (Synthesized via Web Audio API)
        function playAlarm() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let iteration = 0;
                const maxIterations = 4; // Repeats the arpeggio pattern for ~5 seconds

                const playPattern = () => {
                    if (iteration >= maxIterations) return;

                    // Radial's bright ascending electronic/marimba notes configuration
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, index) => {
                        const startTime = audioCtx.currentTime + (index * 0.08);
                        
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();

                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(freq, startTime);

                        // Clean plucking envelope mimicking an iOS digital chime
                        gainNode.gain.setValueAtTime(0.2, startTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.25);

                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);

                        oscillator.start(startTime);
                        oscillator.stop(startTime + 0.25);
                    });

                    iteration++;
                    if (iteration < maxIterations) {
                        setTimeout(playPattern, 1200); // Repeat pattern spacing
                    }
                };

                playPattern();
            } catch (e) {
                console.log('Audio context not supported or blocked by browser policy.');
            }
        }

        // Initialize SVG path setup on load
        setTimeout(updateSvgDimensions, 50);
    </script>
